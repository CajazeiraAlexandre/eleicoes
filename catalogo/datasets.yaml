tse.resultados_2026_1t:
  grupo: eleicoes
  fonte: tse
  acesso: api
  descricao: Resultados provisórios do primeiro turno de 2026, agregados por UF no
    Brasil e por município no Piauí
  url_fonte: https://resultados.tse.jus.br/oficial/app/index.html
  endpoint: https://resultados.tse.jus.br/oficial/comum/config/ele-c.jws
  snapshot: sempre
  granularidade:
  - turno
  - cargo
  - uf
  - municipio
  - coleta
  anos:
  - 2026
  caminho: dados/snapshots/tse.resultados_2026_1t/atual.json
  pipeline:
  - fontes/tse/coletar_resultados_2026.py
  decisoes:
  - EL0003
  observacoes: 'Guarda somente o arquivo consolidado mais recente; preserva os JWS
    e os payloads verificados. Escopo: totais oficiais, UFs configuradas e todos os
    municípios do Piauí para os cargos aplicáveis. Captura de 2026-10-05 (100% totalizado,
    1.257 arquivos, 122 MB) mantida FORA do git por decisão do pesquisador; usada
    como fonte do destino dos votos (EL0003).'
  status: baixado
