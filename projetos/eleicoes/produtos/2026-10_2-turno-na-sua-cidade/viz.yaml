# Story declarativo (L0007; hospedeiro story no lab-viz.js, Q-066). Roteiro validado pelo pesquisador em 2026-10-11.
# Validar: python -m labdados.viz validar projetos/eleicoes/produtos/2026-10_2-turno-na-sua-cidade
# Gerar:   python -m labdados.viz og      projetos/eleicoes/produtos/2026-10_2-turno-na-sua-cidade
# {e.…} = texto ou dado do Python, por município (analise/preparar_2_turno_na_sua_cidade.py); nenhum número à mão.
# Cada cartão escolhe a vista: o gráfico (principal), o mapa (companheiro) ou um componente com dados próprios
# (quadros, linhas, barras). `se` = condição calculada no Python (o cartão some quando é falsa; "!" inverte).
id: 2026-10_2-turno-na-sua-cidade
tipo: story
edicao: null
status: rascunho
origem: eleicoes/2026-10_locais-de-votacao@1.2

tarefa: {categoria: relacao, alvo: fora_da_curva, pergunta: "Em que lugares da sua cidade estão os votos que ainda podem decidir o 2º turno?"}

texto:
  chapeu: "1º turno de 2026 · {c.municipio}"
  titulo: "Onde o 2º turno para presidente pode ser decidido em sua cidade?"
  amostra: {grafico: "{e.amostra_grafico}", mapa: "{e.amostra_mapa}"}
  fonte: "TSE (1º turno de 2018, 2022 e 2026, por local de votação e por município)"
  fonte_curta: TSE
  como_ler: >-
    ⟦Votos em disputa⟧ = abstenções + brancos e nulos + votos nas candidaturas fora da disputa principal (Lula ×
    Flávio Bolsonaro). Um local fica ⟦em destaque⟧ quando Lula perdeu participação desde 2022 e os votos em disputa
    estão na mediana dos locais da cidade ou acima.
  notas:
    - Relação entre lugares não descreve o voto de pessoas.
    - Votos em disputa não são previsão nem estimativa de quantos votos uma candidatura pode ganhar.
    - Locais especiais (trânsito, presos, temporários) e locais sem par em 2022 ficam fora (EL0009).
    - "Em 2018 e 2022, cada candidatura é comparada com a do seu partido: Lula com Haddad (PT, 2018) e Lula (2022); Flávio Bolsonaro com Jair Bolsonaro (PSL, 2018; PL, 2022). Ciro Gomes e as demais ficam em outras candidaturas (EL0010)."
    - Bairro como consta no cadastro do TSE; nomes diferentes do mesmo bairro não são juntados.

dados:
  fonte: {analise: projetos/eleicoes/analise/preparar_2_turno_na_sua_cidade.py, tabela: data/locais}
  indice: data/municipios.json
  fatiar_por: municipio
  colunas:
    id: {tipo: rotulo}
    local: {tipo: rotulo, rotulo: Local}
    endereco: {tipo: texto}
    bairro: {tipo: texto}
    lat: {tipo: geo}
    lon: {tipo: geo}
    aptos: {tipo: medida, rotulo: Eleitores aptos, curto: aptos}
    variacao: {tipo: medida, rotulo: Variação de Lula desde 2022, curto: Var. Lula}
    disputa: {tipo: medida, rotulo: Votos em disputa, curto: Em disputa, curto_valor: votos em disputa, rotulo_tamanho: votos em disputa do local}
    abstencoes: {tipo: medida, curto: abstenções}
    brancos_nulos: {tipo: medida, curto: brancos e nulos}
    outras: {tipo: medida, curto: outras candidaturas}
    perdas: {tipo: medida, rotulo: "Votos de Lula perdidos desde 2022 (contados à parte)"}
    destaque: {tipo: booleano, rotulo: Em destaque, curto: Destaque}
  conferencias:
    - "tabela de locais idêntica à do piloto votos-em-disputa (mesmas funções)"
    - "bairros: a soma dos bairros fecha com a soma dos locais em destaque em todas as cidades (relatorio_qualidade_2_turno_na_sua_cidade.json)"
  decisoes: [L0001, L0002, EL0002, EL0003, EL0008, EL0009, EL0010]

estilo:                                   # cores de candidatura dos produtos de 2026
  tokens:
    cg-lula: ["#e34948", "#e66767"]
    cg-flavio: ["#2a78d6", "#3987e5"]
    cg-cury: ["#4a3aa7", "#9085e9"]
    cg-renan: ["#eda100", "#c98500"]
    cg-outros: ["#7a7873", "#a3a19b"]
    cor-abstencao: ["#8a5a2e", "#d39a62"]
    cor-brancos-nulos: ["#c9a47c", "#c9a47c"]

grafico:
  componente: dispersao
  ligacoes: {x: variacao, y: disputa, tamanho: disputa, rotulo: local}
  opcoes: {forma: pontos, cor: cg-lula, titulo_x: "← perdeu · Lula desde 2022 (p.p.) · ganhou →", titulo_y: "votos em disputa ↑"}
  destaque: {coluna: destaque, fora: cinza, rotulo: fora do destaque, rotulo_dentro: em destaque}
  anotacoes:
    - {tipo: linha, eixo: x, valor: 0, texto: "{e.ref_x}"}
    - {tipo: linha, eixo: y, valor: "{e.med_y}", texto: "{e.ref_y}"}
    - {id: maior, tipo: balao, alvo: "{e.maior.alvo}", texto: "{e.maior.texto}", prioridade: 1}
  detalhe:
    titulo: local
    contexto: [endereco, bairro]
    linhas: [variacao, {campo: disputa, de: aptos}, {grupo: [abstencoes, brancos_nulos, outras]}, perdas]
  companheiro:
    componente: mapa_pontos
    ligacoes: {lat: lat, lon: lon, tamanho: disputa, rotulo: local}
    opcoes: {forma: bolhas, fundo: osm}
    vazio: "{e.mapa_vazio}"

cartoes:
  - {id: capa, imagem: destaque, titulo: "Onde o 2º turno para presidente pode ser decidido em {c.municipio}?", texto: "{e.capa}", capa: true}
  - {id: cidade, titulo: "Lula em {e.nome} no 1º turno de 2026", texto: "{e.resumo_texto}",
     componente: quadros, dados: "{e.resumo_numeros}", opcoes: {nota: "{e.resumo_comparacao}"}}
  - {id: serie, titulo: "Como {e.nome} votou para presidente: 2018 → 2022 → 2026", texto: "{e.serie_texto}", componente: linhas, dados: "{e.serie}",
     opcoes: {legenda_extra: "tracejado: não são candidaturas · em 2018 e 2022, a candidatura do partido (EL0010)"}}
  - {id: sem-locais, titulo: "Os locais de votação de {e.nome}", texto: "{e.sem_comparaveis}", se: "!tem_comparaveis"}
  - {id: locais, titulo: "Os locais de votação de {e.nome}: variação de Lula e votos em disputa", texto: "{e.locais_texto}", vista: principal, destaque: false, se: tem_comparaveis}
  - {id: destaque, titulo: "Onde Lula perdeu espaço e há mais votos em disputa em {e.nome}", texto: "{e.destaque_texto}", vista: principal, se: tem_comparaveis}
  - {id: maior, titulo: "O local em destaque com mais votos em disputa em {e.nome}", texto: "{e.maior_texto}", vista: principal, anotacoes: [maior], se: tem_destaque}
  - {id: mapa, titulo: "Onde ficam os locais em destaque de {e.nome}", texto: "{e.mapa_texto}", vista: mapa, anotacoes: [maior], se: tem_mapa}
  - {id: bairros, titulo: "Os bairros de {e.nome} com mais votos em disputa nos locais em destaque", texto: "{e.bairros_texto}", componente: barras, dados: "{e.bairros}",
     opcoes: {rotulo: bairro, valor: disputa, nota_valor: locais, nota_rotulo: "locais em destaque", titulo_valor: "votos em disputa nos locais em destaque"}, se: tem_bairros}
  - {id: fim, titulo: "Para ver mais", texto: "Troque de cidade, ou veja o painel de onde este story saiu.", fim: true, links: [
      {rotulo: "O painel da cidade: abstenção e votos por local, 2022 e 2026", href: "https://cajazeiraalexandre.github.io/eleicoes/onde-o-2-turno-se-decide/#mun={e.m}"}]}

legenda:
  tamanho: true
  extras: [{tipo: tracejada, texto: "{e.legenda_linhas}", vistas: [principal]}]

controles:
  - {id: municipio, tipo: busca, campo: municipio, obrigatorio: true, inicial: "2211001", padrao_link: true, local: titulo, rotulo: Cidade}
  # tamanho no gráfico e no mapa, um só estado (L0014); até o leitor escolher: gráfico fixo, mapa relativo.
  # O fundo de ruas fica sempre ligado no mapa (pesquisador, 2026-10-11): não é opção em Explorar.
  - {id: tamanho, tipo: alternar, opcao: forma, valores: {pontos: Fixo, bolhas: Relativo}, inicial: null, local: grafico, explorar: true, rotulo: Tamanho}

formatos: {aceitos: [story, paisagem]}
saidas:
  dados: [csv]
  imagens: {og: {estado: {municipio: "2211001", cartao: destaque}, formato: paisagem}}
  embed: {largura: 400, altura: 720}
