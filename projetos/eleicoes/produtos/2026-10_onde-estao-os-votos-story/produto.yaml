id: 2026-10_onde-estao-os-votos-story
titulo: Onde estão os votos no Piauí
tipo: story
status: publicado
versao: '1.0'
edicao: null
deriva_de: 2026-10_distribuicao-votos-candidato-pi
pergunta: Onde estão os votos das candidaturas mais votadas no Piauí em 2026 — espalhados pelo estado ou concentrados
  em poucos municípios — e quais mapas de votos andam juntos?
recorte:
  territorio: Piauí, 224 municípios
  eleicao: 1º turno de 2026
  cargos: Senado (os 3 mais votados), deputado estadual (os 15 mais votados), governador e presidente (correlação)
design_system: null
decisoes_locais:
  roteiro: 'Proposto pelo Claude Code com autonomia (piloto): Senado (mais votado por município; mapa de cada um),
    concentração dos deputados estaduais, correlação entre mapas.'
  escala_mapa: '% dos válidos em 5 faixas iguais de 0 ao maior valor da candidatura, no tom da cor do grupo do partido
    — a versão em classes da escala linear do produto de origem; mapas de candidaturas diferentes não se comparam
    pela cor (dito em Como ler).'
  concentracao: 'Dois indicadores descritivos novos, só deste piloto: parte dos votos que vem do município com mais
    votos e número de municípios que somam metade dos votos (soma dos votos, sem ponderação). A confirmar antes
    de virarem indicador do projeto.'
  senado: Mais votado no município entre os três candidatos com mais votos no estado; duas vagas, percentuais do
    município somam 200%.
  correlacao: Pearson por município, peso igual, n = 224 — a função e a regra do produto de origem.
  cores: Grupos do EL0004 com as cores do EL0006; o PL fica em Outros (a cor própria do PL é decisão local só do
    produto de origem).
