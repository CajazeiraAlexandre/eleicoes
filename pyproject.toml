[project]
name = "labdados"
version = "0.1.0"
description = "Laboratório de dados públicos — núcleo comum de pipelines e utilitários"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15",
  "httpx>=0.27",
  "pyyaml>=6",
  "pandera>=0.20",
  "cryptography>=42",
  "numpy>=1.26",
  "jsonschema>=4.20",       # validação da especificação das Visualizações (L0007)
]

[project.optional-dependencies]
geo = ["geopandas>=1.0", "shapely>=2.0", "geobr", "rasterio>=1.4"]   # rasterio: leitura de janelas do MapBiomas (raster), projeto metodos-e-recursos
dev = ["pytest>=8", "jupyterlab"]
cultura = ["pandas>=2.2", "openpyxl>=3.1"]   # projeto cultura (bases do MinC e do IBGE em XLSX/Parquet)
geocodificacao = ["geocodebr>=0.2"]
educacao = ["xlrd>=2.0", "certifi"]           # projeto educação: sinopses antigas do INEP (.xls) e cadeia TLS do INEP           # endereço → lat/long com o CNEFE (Ipea; L0005)

[tool.setuptools.packages.find]
where = ["nucleo"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
