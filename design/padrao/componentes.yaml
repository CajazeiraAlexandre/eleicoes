# Registro de componentes do design system padrão — contrato de cada gráfico (L0007, L0011, L0013).
# O design.yaml diz COMO PARECE (regras visuais); este arquivo diz COMO SE CONECTA: que papéis de dados o componente
# aceita, que tarefas atende e em que status está. Contrato mínimo: implementa, papeis e tarefas; o resto tem padrão.
# Status: experimental (pode ser usado, com aviso) → estavel (depois de usado e revisto). Lista aberta: componente novo
# entra aqui como experimental, com um exemplo (L0007).
# Papéis: tipo das colunas que aceita (rotulo, texto, categoria, medida, tempo, geo, booleano); obrigatorio: true/false.
# tamanho variável ⇒ legenda de tamanho obrigatória (L0013); destaque/rotulos/detalhe/anotacoes valem para todos.
# Na Visualização declarativa, cada componente precisa de um ADAPTADOR em web/componentes/lab-viz.js
# (Lab.viz.adaptadores.<id>). Fase 1: dispersao e mapa_pontos; os demais ganham adaptador quando um produto pedir (Q-066).

barras100:
  implementa: Lab.linhaBarra100        # a migrar para SVG (L0012)
  status: estavel
  tarefas: [parte_do_todo, comparacao]
  papeis:
    linha: {tipo: [rotulo, tempo, categoria], obrigatorio: true}
    serie: {tipo: [categoria], obrigatorio: true}
    valor: {tipo: [medida], obrigatorio: true}
    absoluto: {tipo: [medida]}
    nota_linha: {tipo: [texto]}
  elementos_implicitos: [{tipo: pontilhada, rotulo: "linha pontilhada: 50% (maioria)"}]   # Q-045 (em teste)

linhas:
  implementa: Lab.linhasPontas
  status: estavel
  tarefas: [evolucao, comparacao]
  papeis:
    x: {tipo: [tempo], obrigatorio: true}
    y: {tipo: [medida], obrigatorio: true}
    serie: {tipo: [categoria], obrigatorio: true}

mapa:
  implementa: Lab.mapa                  # L0006 (câmera, zoom, referência, fundo) e L0013 (dois dedos)
  status: estavel
  tarefas: [espaco]
  papeis:
    geo: {tipo: [geo], obrigatorio: true}
    cor: {tipo: [medida, categoria], obrigatorio: true}
    tamanho: {tipo: [medida]}
    rotulo: {tipo: [rotulo, geo]}       # no mapa, a própria unidade é o rótulo

distribuicao:
  implementa: Lab.distribuicao          # um círculo por unidade num eixo; resumo pronto do Python
  status: estavel
  tarefas: [distribuicao]
  papeis:
    x: {tipo: [medida], obrigatorio: true}
    cor: {tipo: [medida, categoria]}
    tamanho: {tipo: [medida]}
    rotulo: {tipo: [rotulo, geo]}

boxplot:
  implementa: Lab.boxplot               # quartis e bigodes de Tukey calculados no Python (L0002)
  status: estavel
  tarefas: [distribuicao, comparacao]
  papeis:
    linha: {tipo: [categoria, rotulo], obrigatorio: true}
    valor: {tipo: [medida], obrigatorio: true}
    tamanho: {tipo: [medida]}
    rotulo: {tipo: [rotulo, geo]}

dispersao:
  implementa: Lab.viz.adaptadores.dispersao   # lab-viz.js (fase 1); nas páginas antigas, Lab.dispersao
  status: estavel
  tarefas: [relacao]
  papeis:
    x: {tipo: [medida], obrigatorio: true}
    y: {tipo: [medida], obrigatorio: true}
    cor: {tipo: [medida, categoria]}
    tamanho: {tipo: [medida]}
    rotulo: {tipo: [rotulo]}
  elementos_implicitos: [{tipo: tracejada, rotulo: "linhas de referência (mediana, zero ou x = y), com rótulo direto"}]

mapa_pontos:
  implementa: Lab.viz.adaptadores.mapa_pontos   # lab-viz.js; experimental (L0011, Q-032), a partir do protótipo da bancada
  status: experimental
  tarefas: [espaco]
  papeis:
    lat: {tipo: [geo], obrigatorio: true}
    lon: {tipo: [geo], obrigatorio: true}
    cor: {tipo: [medida, categoria]}
    tamanho: {tipo: [medida]}
    rotulo: {tipo: [rotulo]}
    contorno: {tipo: [geo]}
  opcoes: {forma: [pontos, bolhas], fundo: [nenhum, osm]}

fluxos:
  implementa: Lab.sankey
  status: estavel
  tarefas: [fluxo]
  papeis:
    unidade: {tipo: [rotulo, geo], obrigatorio: true}
    etapa: {tipo: [tempo, categoria], obrigatorio: true}
    categoria: {tipo: [categoria], obrigatorio: true}
    peso: {tipo: [medida]}

quadros:
  implementa: Lab.quadros               # número grande por item; com escolha, vira seletor
  status: estavel
  tarefas: [comparacao]
  papeis:
    rotulo: {tipo: [rotulo, categoria], obrigatorio: true}
    valor: {tipo: [medida], obrigatorio: true}
    cor: {tipo: [categoria]}

tabela:
  implementa: Lab.tabela
  status: estavel
  tarefas: [comparacao]
  papeis:
    linhas: {tipo: [rotulo], obrigatorio: true}
    colunas: {tipo: "*", obrigatorio: true}
