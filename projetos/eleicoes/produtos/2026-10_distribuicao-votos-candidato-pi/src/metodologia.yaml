decisoes_resumo:
  L0001: Códigos municipais TSE e IBGE ligados só quando UF e nome normalizado coincidem de forma única; nada é aproximado.
  L0002: Produtos em arquivo único; cálculos em Python, com somas e correlações leves no navegador conferidas por paridade.
  EL0002: No Piauí, os três municípios com apóstrofo no nome foram pareados manualmente, completando os 224.
  EL0003: Votos válidos por seção reconstruídos com o destino oficial dos votos (exclui anulados, sub judice e nulos técnicos).
  EL0004: Cor da candidatura pelo grupo do partido — PT/PV/PCdoB (federação), União Progressista (PP + União), PSD, MDB e Outros; neste produto, o PL também tem cor própria (azul claro; decisão local).
  EL0007: Mesma pessoa candidata entre eleições = nome civil completo + data de nascimento (única por eleição; CPF só para conferir).
  EL0006: Cores dos grupos fixas e validadas para daltonismo (PT/PV/PCdoB vermelho, PSD laranja, MDB verde, União Progressista azul, Outros cinza).
