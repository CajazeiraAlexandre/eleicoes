# Ficha do produto (recorte público: sem as chaves de dinâmica interna do laboratório — L0010)
id: 2026-10_distribuicao-votos-candidato-pi
titulo: Onde estão os votos? Distribuição territorial de candidaturas no Piauí
tipo: exploratorio
status: publicado
versao: '1.1'
versao_data: 2026-10-07
deriva_de: null
pergunta: Como os votos de uma candidatura se distribuem pelo território do Piauí, do município ao local de votação,
  e quais candidaturas de outros cargos apresentam percentuais mais ou menos correlacionados com ela?
recorte:
  territorio: Piauí
  eleicoes:
    '2022':
      turnos:
        primeiro: todos_os_cargos
        segundo: presidente_e_governador_quando_houver
    '2026':
      turnos:
        primeiro: todos_os_cargos
        segundo: fora_deste_produto
      carater: resultados totalizados publicados pelo TSE em 2026-10-05 (arquivos por seção); exibir data/hora de
        geração dos arquivos
  niveis:
    estado: totais do PI
    municipio: mapa coroplético + tabela
    regiao_geografica_imediata: pendente de validação temporal (já pendente no escopo anterior)
    zona: tabela e ranking; sem polígonos (sem geometria oficial)
    local_votacao: mapa de pontos (coordenadas oficiais TSE) + tabela
    secao: somente tabela/download
