pergunta: Em que lugares da sua cidade estão os votos que ainda podem decidir o 2º turno?
recorte:
  eleicao: Presidente, 1º turno de 2026 × 1º turno de 2022; série 2018–2026 no cartão de linhas
  territorio: uma cidade por vez (5.570), a do link ou da busca (padrão Teresina); estado e Brasil só como linha
    de comparação no resumo
  unidade: município e local de votação convencional com par em 2022 (EL0009)
  candidatura: só Lula, como no piloto (pesquisador, 2026-10-11)
tarefa:
  categoria: relacao
  alvo: fora_da_curva
  pergunta: Em que lugares da sua cidade estão os votos que ainda podem decidir o 2º turno?
design_system: null
roteiro: 'Validado pelo pesquisador em 2026-10-11: capa; a cidade no 1º turno (números grandes + linha do estado
  e do Brasil); 2018 → 2022 → 2026 em linhas (como o resumo de origem); local a local (dispersão); onde as duas
  coisas se juntam (destaque); o maior deles (anotação); onde ficam (mapa); por bairro (barras); fim. Sem os cartões
  de definição e de limites (ficam em ✎ Notas e fontes) e sem o capítulo de 2022 entre turnos.'
decisoes_locais:
  2026_10_12_titulos_autossuficientes: 'Pesquisador (2026-10-12): a imagem de um cartão circula sozinha e o título
    narrativo ("Onde ficam", "O maior deles") deixava de fazer sentido. Títulos com a cidade e o recorte (Claude
    Code, a conferir); a imagem leva o chapéu com o recorte e, se o leitor tocou num local, o bloco "Em foco" com
    os números dele.'
  2026_10_11_bairros: Bairro como consta no cadastro do TSE (2026), agrupado só sem diferença de maiúsculas, acentos
    e espaços, sem juntar variantes; medida = soma dos votos em disputa dos locais em destaque; os 10 maiores; o
    cartão sai quando a cidade tem menos de 3 bairros com local em destaque (pesquisador, 2026-10-11).
  2026_10_11_cor: No story, a cor marca só o destaque (Lula), sem a escala do 2º turno de 2022 do piloto, que saiu
    do roteiro.
