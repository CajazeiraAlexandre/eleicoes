# Resumo de uma linha de cada decisão citada no produto (o ADR completo fica no repositório).
decisoes_resumo:
  L0001: Códigos municipais TSE e IBGE ligados só quando UF e nome normalizado coincidem de forma única; nada é aproximado.
  L0002: Produtos em arquivo único; cálculos em Python, a página só seleciona e desenha.
  EL0002: No Piauí, os três municípios com apóstrofo no nome foram pareados manualmente, completando os 224.
  EL0003: Votos válidos por seção reconstruídos com o destino oficial dos votos (exclui anulados, sub judice e nulos técnicos).
  EL0004: Grupo = partido da candidatura na eleição; PT = federação; PP = PP + União Brasil em 2022, 2024 e 2026; prefeito pelo partido do eleito.
  EL0005: Força em % dos válidos, vagas, prefeituras, consistência entre cargos e no tempo, liderança com intensidade e margem, fluxos de liderança.
  EL0006: Cores dos grupos fixas e validadas para daltonismo (PT vermelho, PSD laranja, MDB verde, PP azul, Outros cinza).
