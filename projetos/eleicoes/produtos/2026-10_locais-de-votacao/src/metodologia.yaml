# Textos do bloco "Fontes de Dados, Metodologia e Códigos" (padrão de todos os produtos — ADR L0003).

apresentacao: >-
  Esta página mostra, para cada local de votação de uma cidade, os eleitores aptos, os votos para Presidente
  no 1º turno de 2026 (Lula, Flávio Bolsonaro, Augusto Cury, Renan Santos e os demais) e a abstenção, com a
  variação em relação ao 1º turno de 2022 no mesmo local. Todos os números vêm dos arquivos oficiais do TSE
  por seção eleitoral, somados por local; nada é estimado ou completado. Locais sem correspondente em 2022
  aparecem com "—".

modulos:
  locais: projetos.eleicoes.analise.preparar_locais_mapa_virada
  votos: projetos.eleicoes.analise.preparar_locais_votacao

passos:
  - titulo: De seção para local de votação
    texto: >-
      Cada seção eleitoral pertence a um local de votação (uma escola, por exemplo). Em 2026, o arquivo de
      resultados do TSE não traz o local da seção; ele vem do cadastro de locais de votação. Seções agregadas
      contam no local da seção principal, onde o eleitor vota. A soma dos locais confere, sem diferença, com
      o total oficial de cada cidade (aptos, abstenções, votos válidos e votos de cada candidatura), em 2026 e em 2022.
    adrs: [EL0009]
  - titulo: Votos válidos e comparação com 2022
    texto: >-
      Os percentuais são sobre os votos válidos (sem brancos e nulos). Votos de candidatura que o TSE não conta
      como válidos ficam fora, como no total oficial — em 2026, os 5.123 votos de uma candidatura ausente dos
      resultados oficiais, que o TSE trata como nulos. Para comparar com 2022, cada candidatura de 2026 é
      comparada com a candidatura do seu partido em 2022: Lula com Lula (PT) e Flávio Bolsonaro com Jair
      Bolsonaro (PL). Eleição presidencial é muito personificada e, no 1º turno, o voto em outras candidaturas
      costuma ser de oposição ou protesto; por isso os partidos que apoiam Lula em 2026 não são somados a ele nos
      anos anteriores (Ciro Gomes, do PDT, fica em "Outros" em 2022). Augusto Cury e Renan Santos não tiveram
      candidatura do seu partido em 2022 e ficam sem variação. "Outros" reúne Ronaldo Caiado e as demais
      candidaturas.
    adrs: [EL0003, EL0010]
    codigo: votos.bloco_presidente
  - titulo: O mesmo local em 2022
    texto: >-
      O TSE não tem um código fixo para o local entre eleições. Um local de 2026 tem par em 2022 quando a zona e
      o número do local são os mesmos e o nome é igual (sem acentos e pontuação) ou as coordenadas estão a até
      100 metros. Locais de voto em trânsito, de presos provisórios e temporários não entram na comparação. A
      linha "Total da cidade" compara a cidade inteira (todos os locais de cada eleição).
    adrs: [EL0009]
    codigo: locais.situacao_par

  - titulo: Como a cidade votou, 2018–2026
    texto: >-
      O gráfico de linhas mostra, no 1º turno de cada eleição presidencial, a parte do eleitorado apto que votou em
      cada candidatura, votou em branco ou nulo, ou não compareceu (as linhas somam 100%). Em 2018 e 2022, a linha
      de Lula é a candidatura do PT (Fernando Haddad, Lula) e a de Flávio Bolsonaro, a de Jair Bolsonaro (PSL, PL).
      Os totais são os oficiais por cidade. O quadro ao lado conta, entre os locais com par em 2022, em quantos cada
      candidatura e a abstenção subiram
      ou caíram, e a variação mediana. Não há gráfico de fluxo (sankey): saber quem mudou de voto exigiria
      estimar transferências de eleitores a partir de totais, o que estes dados não permitem afirmar.
    adrs: [EL0010, EL0009]
  - titulo: Onde há mais votos em disputa
    texto: >-
      Para cada local, contam-se os eleitores que não escolheram nenhuma das duas candidaturas principais (Lula e
      Flávio Bolsonaro): os que não compareceram, os que votaram em branco ou nulo e os que votaram nas demais
      candidaturas (sem contar os votos da própria candidatura escolhida). A conta é a mesma para qualquer
      candidatura. O gráfico cruza esse número com a variação da candidatura no local desde 2022; os votos que ela
      perdeu desde 2022 aparecem à parte, porque podem ser das mesmas pessoas que hoje se abstêm ou votam em outra
      candidatura. Não é previsão nem estimativa de quantos votos uma candidatura pode ganhar.
    codigo: votos.votos_em_disputa
  - titulo: Do 1º para o 2º turno
    texto: >-
      Entre o 1º e o 2º turno o eleitorado de um lugar é praticamente o mesmo. Por isso, os votos que cada uma das
      duas candidaturas ganhou, somados à variação de brancos e nulos e de abstenção, igualam os votos que as
      outras candidaturas tiveram no 1º turno. O quadro da cidade mostra essa conta em 2018 e 2022, e a cor da
      dispersão mostra, em cada local, com quem ficou o ganho em 2022. Aqui a comparação é entre as candidaturas
      (PT × PSL/PL), como no resto da página (EL0010). É o saldo do lugar: não diz quais eleitores mudaram de voto nem prevê 2026.
      Os totais do estado e do Brasil somam os municípios (exterior fora); os nomes das outras candidaturas do
      1º turno vêm do cadastro de candidaturas do TSE.
    codigo: votos.saldo_entre_turnos
  - titulo: Fundo de ruas do mapa
    texto: >-
      O fundo de ruas é opcional e vem desligado. Quando ligado, as imagens do mapa são pedidas aos servidores do
      OpenStreetMap (© OpenStreetMap contributors), que recebem o endereço de internet de quem vê a página e a área
      mostrada. Funciona na página publicada; aberta direto do computador ou sem internet, o mapa segue sem fundo.
      Os dados dos locais não mudam.

perguntas:
  - p: Por que alguns locais não têm variação?
    r: >-
      Porque não foi possível garantir que são o mesmo lugar em 2022: o número do local é novo na zona, ou o
      número existia mas com outro nome e a mais de 100 metros. Nesses casos a variação não é calculada.
  - p: Por que alguns locais não aparecem no mapa?
    r: >-
      O cadastro do TSE não traz coordenada para alguns locais, e outros têm coordenada fora da própria cidade.
      Eles estão na tabela; a posição não é estimada.

limitacoes:
  - "Relação entre lugares não descreve o voto de pessoas: o local reúne eleitores que mudam entre eleições."
  - "Pares pela localização podem juntar dois locais vizinhos diferentes; a dica de cada local mostra o nome de 2022 e a distância."

codigos:
  - arquivo: projetos/eleicoes/analise/preparar_locais_votacao.py
    papel: Soma votos, aptos e abstenções por local, liga 2026 a 2022, confere com os totais oficiais e grava data/locais/<IBGE>.js.
  - arquivo: projetos/eleicoes/analise/preparar_locais_mapa_virada.py
    papel: Ligação seção → local, regra do mesmo local (EL0009) e contorno das cidades.

sobre: >-
  Produto do Laboratório de Dados Públicos, por Alexandre Ribeiro Cajazeira Ramos. Derivado de "O mapa da virada".

uso_de_ia: >-
  Claude (Claude Code, Anthropic) implementou a preparação dos dados, a conferência, a página e a exportação,
  e redigiu estes textos, sob orientação do pesquisador, que definiu o recorte, as colunas, a comparação com
  2022 e as regras metodológicas (EL0009, EL0010). Revisão humana dos resultados pendente.

licenca: "Código: MIT · Dados derivados: CC BY 4.0"

citacao: "RAMOS, Alexandre Ribeiro Cajazeira. Onde o 2º turno pode ser decidido em sua cidade: locais de votação, Presidente 2026. Laboratório de Dados Públicos, 2026."

decisoes_resumo:
  EL0003: "Votos válidos por seção reconstruídos com o destino oficial de cada candidatura."
  EL0008: "Conglomerados de 2026: cada candidatura identificada pelo partido (para Presidente, só em 2026 — EL0010)."
  EL0010: "Presidente: cada candidatura de 2026 comparada com a do seu partido em 2018 e 2022."
  EL0009: "Mesmo local em 2022 e 2026: mesma zona e número, e nome normalizado igual ou até 100 m."
