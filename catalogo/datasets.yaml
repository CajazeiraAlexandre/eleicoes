pi.territorios_desenvolvimento:
  grupo: territorio
  fonte: wikipedia
  acesso: arquivo
  descricao: Composição municipal dos 12 Territórios de Desenvolvimento do Piauí (LC
    87/2007; Lei 6.967/2017)
  url_fonte: https://pt.wikipedia.org/wiki/Territ%C3%B3rios_de_Desenvolvimento_do_Piau%C3%AD
  granularidade:
  - municipio
  - territorio_desenvolvimento
  anos:
  - 2017
  caminho: dados/referencia/territorios_desenvolvimento_pi.csv
  pipeline:
  - fontes/wikipedia/baixar_territorios_pi.py
  - fontes/wikipedia/padronizar_territorios_pi.py
  decisoes: []
  observacoes: 'Fonte secundária (Wikipédia, revisões fixadas no manifesto) por decisão
    do pesquisador em 2026-10-05; fontes oficiais inacessíveis. Conferência automática
    OK: 224 municípios, 12 territórios, cada município em um só território. A fonte
    tinha 1 duplicidade (São Miguel do Fidalgo) e 2 ausências (Barras, São Francisco
    do Piauí), resolvidas por decisão do pesquisador em dados/referencia/territorios_desenvolvimento_pi_excecoes.csv.
    Substituir pelo Anexo Único da Lei 6.967/2017 quando acessível.'
  status: explorado
