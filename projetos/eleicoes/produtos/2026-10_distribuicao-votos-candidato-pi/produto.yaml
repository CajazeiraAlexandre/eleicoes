validacoes_concluidas:
- item: Paridade JS × Python (L0002), 2026-10-05
  resultado: 228 casos (agregação por município e por local, percentuais e Pearson nas três eleições) sem divergência;
    tests/test_eleicoes_distribuicao_pi_paridade.py roda src/paridade.html no Chrome headless.
- item: Reconciliação nacional dos votos nominais, de legenda e válidos de 2022
  resultado: 39.604 chaves coincidentes sem divergências; eleição geral ordinária, partições BRASIL.csv e exclusão
    territorial de ZZ.
  relatorio: histórico — script e relatório da versão nacional removidos na versão 1.0 (2026-10-06)
- item: Inspeção prévia dos arquivos de 2026 do PI (em memória, 2026-10-05)
  resultado: votacao_secao_2026_PI com Governador, Senador, Dep. Federal e Dep. Estadual; Presidente só em votacao_secao_2026_BR;
    detalhe por seção com os 5 cargos (10.225 seções cada); cadastro de locais com 3.402 de 3.481 locais com coordenadas.
    Arquivos baixados e registrados no manifesto.
- item: Relatório de qualidade por seção do PI, 2022 e 2026 (2026-10-05)
  resultado: 'Seção × detalhe sem divergências (53.778 chaves em 2022; 51.125 em 2026). 2022: seções × município/zona
    por candidatura sem divergências, exceto 4 candidaturas INAPTAS ausentes do município/zona (16.459 votos). Válidos
    reconstruídos (EL0003) iguais aos oficiais: 11.800.321 (2022, 1.380 chaves) e 12.022.196 (2026, API, 1.120 chaves;
    75.595 candidatura × município). Locais: 2022 3.342/3.377 e 2026 3.402/3.481 com coordenadas; 57 e 48 pontos
    fora do polígono do próprio município (reportados, não corrigidos).'
  relatorio: projetos/eleicoes/analise/relatorio_qualidade_distribuicao_pi.json
- item: Versão 1.0 — revisão final (2026-10-06)
  resultado: '2018 incluído (opção B; EL0003 adendo 2018): seções × detalhe município/zona sem divergências em 1.380
    chaves; válidos 12.030.734 = oficiais. Paridade JS × Python: 344 casos, 0 falhas. EL0007: 159 pessoas ligadas,
    0 ambíguas, 0 conflitos de CPF. Página testada no Chrome headless em todos os níveis, com comparação entre eleições,
    seleção no mapa e celular, sem erros de JavaScript.'
validacoes_pendentes:
- Repetir a conferência de 2026 contra os arquivos município/zona quando o TSE publicá-los
- Mapa de variação: escala divergente (cinza/cor do grupo) e saturação no percentil 95 em votos
- Cobertura temporal das Regiões Geográficas Imediatas (2017) para 2018–2026 e fonte oficial dos Territórios (Lei
  6.967/2017)
