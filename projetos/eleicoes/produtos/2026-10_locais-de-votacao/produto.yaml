# Ficha do produto (recorte público: sem as chaves de dinâmica interna do laboratório — L0010)
id: 2026-10_locais-de-votacao
titulo: 'Onde o 2º turno pode ser decidido em sua cidade: locais de votação, Presidente 2026'
tipo: painel
status: publicado
versao: '1.2'
deriva_de: 2026-10_mapa-da-virada
pergunta: 'Em cada local de votação de uma cidade escolhida: quantos eleitores aptos, quanto votaram Lula, Flávio
  Bolsonaro, Augusto Cury, Renan Santos e os demais no 1º turno de 2026, qual foi a abstenção — e quanto isso variou
  em relação ao 1º turno de 2022 no mesmo local.'
recorte:
  eleicao: Presidente, 1º turno de 2026 × 1º turno de 2022
  territorio: Brasil, um município por vez (exterior fora)
  unidade: local de votação (seções somadas; seções agregadas no local da principal)
  colunas: Lula, Flávio, Cury, Renan, Outros (Caiado e demais) — pesquisador, 2026-10-08
variacao: 'Pelo grupo de 2026 aplicado a 2022 (EL0008): Lula × grupo de Lula em 2022 (inclui Ciro/PDT); Flávio ×
  PL (Bolsonaro); Cury e Renan sem candidatura do grupo em 2022 → variação "—"; Outros × demais de 2022. Mesmo local
  pelo EL0009. Votos em % dos válidos (com o número de votos) e variação em p.p.; abstenção em % dos aptos e variação
  em p.p. (pesquisador, 2026-10-08).'
